created_at_utc: "2026-08-18T01:40:00Z"
owner_role: "research"
status: "preregistered"

hypothesis:
  statement: "15分足のdimensionless特徴量から同時刻の銘柄順位をLambdaRankで学び、別のquantile modelで100 USDT longの費用・Funding込みnet return 40%分位点を推定すると、source9銘柄の12 asset×time OOS foldを通過し、学習に一度も使わないETC・FIL・TRX・XLMの2026-01-01〜2026-07-31でcashと6時間momentumを上回る可能性がある。"
  economic_rationale: "EXP-2026-0055には弱い横断順位情報があったが、絶対確率とclass条件付き平均が費用gateへ届かなかった。順位lossで相対選択を直接最適化し、値幅は費用控除後net returnの下側分位点として別に推定すれば、順位能力と経済的取引可否を混同せず未知銘柄へ転移できる可能性がある。"
  expected_failure_modes:
    - "15分足の追加情報がnoiseで、rank ICやtop1選択がmomentumを上回らない。"
    - "q40 modelが0付近へ縮み、entryが不足する。"
    - "下側分位点が過度に楽観的で、実現net returnとcalibrationしない。"
    - "source9銘柄内の順位関係が未観測4銘柄へ移転しない。"
    - "15分Klineは板、queue、時変spreadを表さず、固定費用が実約定を過小評価する。"
    - "Funding、quantity丸め、銘柄別volatilityの差でnet labelが不安定になる。"

methodology:
  setup: "UTC 00:00、06:00、12:00、18:00に判断する。tより前に終了した15分足だけでfeatureを作り、t openでentry、t+6h openでexitする。source train銘柄だけの同時刻groupでrank relevanceを作る。"
  label: "各銘柄を100 USDT longした場合のnet_return=net_pnl/(quantity*raw_entry_open)。raw price PnL、entry<settlement<exitの実績Funding、taker fee、spread、slippage、quantity step、minimum quantityを固定会計で反映する。"
  rank_target: "各train query内でnet returnを昇順rankし0..N-1の整数relevanceへ変換する。同値はsymbol昇順で決定論的に一意化する。"
  features:
    - "local trade close log return: 15分、30分、1、3、6、12、24時間。"
    - "15分log returnの母標準偏差: 1、6、24時間。"
    - "downside semivolatility: 6、24時間。"
    - "直前15分足のbody=(close-open)/open、range=(high-low)/open。"
    - "log1p(volume)とlog1p(turnover)の直近96実測足z-score。"
    - "BTC context: 1、6、24時間returnと6、24時間volatility。"
    - "同時刻groupの6時間return降順percentile rank、中央値差、母標準偏差。"
    - "UTC hour sin/cos。"
  feature_count: 26
  models:
    ranker: "xgboost 3.4.1 native API。objective=rank:pairwise、eval_metric=ndcg@1、max_depth=3、eta=0.05、min_child_weight=20、subsample=1、colsample_bytree=1、lambda=10、alpha=0、gamma=0、tree_method=hist、max_bin=256、seed=0、nthread=1、num_boost_round=300。queryはdecision_time、group行はsymbol昇順。"
    quantile: "xgboost 3.4.1 native API。objective=reg:quantileerror、quantile_alpha=0.40、eval_metric=quantile、rankerと同じtree設定、num_boost_round=300。net returnを直接推定する。"
  entry_rule: "評価groupでrank score最大の銘柄を選ぶ。normalized_margin=(top-second)/max(group score母標準偏差,1e-12)>=0.25、かつ当該銘柄の予測q40 net return>0の場合だけ100 USDT longする。同値はsymbol昇順。"
  exit_rule: "entryから6時間後の15分Kline openで全量exit。途中resize、利確、損切り、signal反転決済なし。"
  no_trade_conditions:
    - "normalized rank margin<0.25、q40<=0、またはいずれかが非有限。"
    - "24時間の96 return区間を作る97個のclose観測windowに欠測、重複、補間、非正価格、非有限値がある。"
    - "Funding、quantity step、minimum quantity、reserve cashを検査できない。"
    - "modelが固定30日期限を超過、またはsource train groupを構築できない。"
  simplicity_rationale: "単一26特徴量set、ranker1設定、quantile alpha1個、margin1個、long top1、固定100 USDTに限定する。feature・threshold・alpha・hyperparameter探索、short、neural network、RL、AutoMLを行わない。"

