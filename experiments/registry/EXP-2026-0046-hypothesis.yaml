hypothesis:
  statement: "EXP-2026-0045のフィボナッチ買い増しを最大3ロットへ制限すると、最大5ロット版の利益の大部分を残しながら最大ドローダウンを改善できる可能性がある。"
  economic_rationale: "EXP-2026-0045では買い増しが最終資産を増やした一方、下落中の銘柄へ最大500 USDTを集中して最大DDが悪化した。後半2段階を削れば、平均取得価格を下げる効果を残しつつ、1銘柄300 USDT、2銘柄合計600 USDTへ集中を限定できる。"
  parent_experiment_ids:
    - "EXP-2026-0042"
    - "EXP-2026-0045"

methodology:
  input: "EXP-2026-0015のZOOMEX linear perpetual 2時間足とFunding履歴。"
  evaluation_window: "2022-02-01T00:00:00Z〜2025-12-31T23:59:59Z UTC。"
  frozen_strategy: "EXP-2026-0042の売買シグナル、EXP-2026-0045の会計・次足open約定・固定100 USDTロットを変更しない。"
  symbols:
    - "LINKUSDT"
    - "UNIUSDT"
    - "AVAXUSDT"
    - "AAVEUSDT"
  arms:
    fixed_200:
      sizing: "EXP-2026-0042と同じ初回200 USDT固定。"
    fibonacci_fixed_percent_max3:
      sizing: "初回100 USDT。初回価格から2.36%、3.82%下落を確定足lowで確認した次足openに各100 USDT追加する。"
      max_lots_per_symbol: 3
    fibonacci_atr_max3:
      sizing: "初回100 USDT。entry時固定20日ATRの1.000倍、1.618倍下落を確定足lowで確認した次足openに各100 USDT追加する。"
      max_lots_per_symbol: 3
  unchanged_execution_rules:
    - "Funding、退出、前足で発火した買い増し、初回entryの順に処理する。"
    - "補間足で初回entryと買い増しtriggerを行わない。"
    - "short、複利、追加レバレッジを使わない。"
  costs:
