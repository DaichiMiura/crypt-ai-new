    max_total_gross_notional: "600"
  no_parameter_sweep: true
  execution_gate: "研究比較のみ。現在のEXP-2026-0042 paper/shadow設定は変更しない。"

evaluation:
  status: "PENDING"
  primary_metrics:
    - "費用・Funding控除後の最終equity"
    - "最大ドローダウン"
    - "return_rate / abs(max_drawdown)"
  secondary_metrics:
    - "年別損益、追加約定数、買い増し後の損失退出数、最大gross/equity比、手数料、Funding、拒否数"
  decision_rule:
    versus_fixed_200: "固定200より最終equityが高く、最大DDを悪化させず、return/DD比も固定200以上なら候補とする。"
    versus_same_max5_arm: "対応する最大5ロット版より最大DDを5ポイント以上改善し、最大5ロット版の最終equityを90%以上維持し、1464.10 USDT以上なら縮小候補とする。"
    final_candidate: "versus_fixed_200とversus_same_max5_armの両方を満たす場合だけpaper候補とする。"
  promotion_rule: "過去データ比較だけではpaper/shadow設定を変更しない。"
  result_artifact: "artifacts/EXP-2026-0046/summary.json"

data:
  source: "ZOOMEX Global public V3 REST API"
  timeframe: "120 minutes UTC"
  artifacts:
