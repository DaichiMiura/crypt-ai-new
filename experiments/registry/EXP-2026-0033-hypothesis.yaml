hypothesis:
  statement: "EXP-2026-0023で比較的バランスが良かった2時間足ロング戦略へ、EXP-2026-0032の現物ロング・無期限先物ショートのベーシス・ヘッジを固定配分で加えると、ロング単独より最大ドローダウンを抑えられる可能性がある。"
  economic_rationale: "方向性ロングの価格エクスポージャーを、同一銘柄の現物long・無期限perpetual shortペアで部分的に中和し、ベーシス収束とFundingを補助的な収益源にする。ヘッジ枠の増加が収益を損なう可能性も同時に検証する。"
  parent_experiment_ids:
