    - "2025年期間を含むデータは既存実験で観測済みであり、未観測OOSではない。"
    - "固定4銘柄かつ週次の少数標本で、他銘柄や他期間への一般化を示さない。"
    - "公開Kline/Fundingは板、部分約定、証拠金、清算、注文拒否を表さない。"
    - "targetは価格volatilityで、Funding、spread、slippage、途中退出を直接予測しない。"
    - "ZOOMEX公開履歴上の研究結果であり、実約定の有効性は未検証。"

evaluation:
  baseline: "固定済みEXP-2026-0042 live_rank_last_exitを100 USDT lot x 2で再現する。"
  primary_metric: "2025-01-01〜2025-12-31 retrospective evaluationの費用・Funding込み最大drawdown差。"
  secondary_metrics:
    - "net PnL retention、entry/exit、Funding、fee、平均gross、high-risk entry比率、volatility MAE"
    - "2022-02-01〜2024-12-31 developmentと2025 evaluationの損益符号"
    - "費用2倍stressの2025 net PnL"
  expected_value_formula: "risk_sized_long_price_pnl + funding_cash_flow - fees - spread - slippage"
  rejection_criteria:
    - "2025 evaluationのcompleted leg round tripsがbaselineより少ない。"
    - "2025 evaluationのnet PnLがbaselineの90%未満。"
    - "2025 evaluationの最大drawdown改善が3 percentage points未満。"
    - "費用2倍stressの2025 net PnLが0以下。"
    - "未来参照、予測、lot数、Funding、配分、会計を再構築できない。"
  reserved_out_of_sample: "なし。2025年は既観測retrospective evaluationであり、候補でも開始後に取得するforwardデータなしに昇格しない。"
  maximum_variants: 1
  random_seed: 0
  research_status: "INCONCLUSIVE"

