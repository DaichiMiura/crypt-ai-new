schema_version: 1
experiment_id: "EXP-2026-0053"
created_at_utc: "2026-08-17T19:30:00Z"
owner_role: "research"
status: "preregistered"

hypothesis:
  statement: "EXP-2026-0042の新規entry時に、過去だけで学習したridge回帰が次週実現volatilityを高リスクと予測した場合のみ固定元本を200 USDTから100 USDTへ半減すると、取引候補を削除せず、2025 retrospective evaluationでbaseline損益の90%以上を維持しながら最大drawdownを3 percentage points以上改善できる可能性がある。"
  economic_rationale: "価格方向よりvolatilityの方が持続性を持つ可能性があり、高volatility局面の元本だけを機械的に抑えれば、元のmomentum entryを残したまま損失振幅を制限できる可能性がある。MLは方向、entry採否、リスク上限緩和には使わない。"
  expected_failure_modes:
    - "volatility予測が不正確で、利益の大きい高volatility局面だけを縮小する。"
    - "entry時の予測だけでは保有中の急激なvolatility上昇へ対応できない。"
    - "固定4銘柄・週次標本では係数がregime変化へ追随しない。"
    - "元本半減によるdrawdown改善が利益減少を上回らない。"

methodology:
  setup: "EXP-2026-0042と同じZOOMEX 4銘柄、確定2時間足、30日相対momentum、週次top2、最下位転落退出をbaselineとする。各週次判断で全4銘柄の標本を作り、判断時点までにtarget期間が終了した標本だけでridge回帰を再学習する。"
  features:
    - "時刻tの確定closeまでの30日momentum_return"
    - "時刻tの4銘柄market_median_momentum"
    - "時刻tのcross_sectional_rankを1〜4へ固定した数値"
    - "時刻tまでの84本close-to-close returnの母標準偏差"
  target: "時刻tのcloseから84本後のcloseまでに得られる84本close-to-close returnの母標準偏差。"
  model: "L2 ridge回帰。各再学習時にtrain標本だけで特徴量とtargetを標準化し、batch gradient descent 800回、learning rate 0.05、L2 0.01、seed 0（乱数不使用）で固定する。"
  risk_threshold: "train targetのnearest-rank 75th percentile。予測volatilityが閾値以上ならhigh riskとする。"
  entry_rule: "EXP-2026-0042のentry候補をすべて維持する。high risk予測または学習標本80未満なら100 USDT（1 lot）、それ以外は200 USDT（2 lots）で次足openにentryする。"
  stop_rule: "EXP-2026-0042と同じ最下位転落退出をtriggerの次足openで適用する。"
  exit_rule: "EXP-2026-0042と同じ週次top2離脱、market regime非正、または最下位転落退出で次足openに決済する。保有中はlot数を変更せず、次の新規entryでだけ最新予測を使う。"
  no_trade_conditions:
    - "元のEXP-2026-0042が候補を出さない。"
    - "データの欠損、重複、補間、時刻不整合、非正価格を検出する。"
    - "配分上限、reserve cash、銘柄上限を満たさない。"
  simplicity_rationale: "単一線形回帰、4特徴量、75th percentile、100/200 USDTの2段階、1 variantだけを固定し、特徴選択、閾値、元本段階を探索しない。"

