schema_version: 1
experiment_id: "EXP-2026-0007"
created_at_utc: "2026-08-15T00:00:00Z"
owner_role: "research"
status: "registered"

hypothesis:
  statement: "EXP-2026-0006で固定したDonchian 55 entry＋Bollinger 20日・2σ exit overlayは、EXP-2026-0006の観測期間後である2026年の未観測期間でも、Donchian 55/20単独と比較して最大ドローダウンを悪化させず、費用控除後の損益特性を維持する。"
  economic_rationale: "下側Bollinger band割れで即時退出せず中心線への戻りを待つことで、短い押し目でトレンドを降りる頻度を減らす。ただし持続的下落では損失を拡大し得るため、base戦略との相対比較で検証する。"
  parent_experiment_ids:
    - "EXP-2026-0006"
  expected_failure_modes:
    - "2026年の持続的下落でoverlayの退出待ちが最大DDを悪化させる。"
    - "未観測期間の取引数が少なく、単一期間の結果が偶然になる。"
    - "Global proxyとBinance Japanの価格basis、spread、流動性、注文制約の差で再現しない。"
    - "2026年のデータに欠損や合成行があり、実測データと同じ証拠として扱えない。"

methodology:
  input: "DATA-2026-0004のBinance Global Spot BTCUSDT 1時間足から作る補間済みUTC日足。2020年からの履歴はシグナルのwarm-upに使い、判定は2026年の未観測期間だけで行う。"
  strategy_freeze: "EXP-2026-0006のentry_window=55、band_window=20、std_multiplier=2、ddof=0、次日始値約定、CostModelを変更しない。"
  base_strategy: "Donchian 55 entry＋Donchian 20 exit。"
  overlay_strategy: "Donchian 55 entry＋下側Bollinger band割れで退出待機、その後20日中心線上抜けでexit。"
  evaluation_type: "preregistered forward test。2026-01-01以降のデータを事前登録時点では結果未観測として固定する。"
  forward_window:
    start_utc: "2026-01-01T00:00:00Z"
    end_utc: "2026-07-31T23:59:59Z"
    cutoff_reason: "2026-08-15時点で完全な月として取得できる直近月までを使い、未完了の日足を含めない。"
  warmup_and_state: "2020-01-01からforward開始前までの履歴で指標を計算する。forward開始時は初期資金1,000 USDT相当にリセットし、開始時のdesired_positionが1なら開始日の始値で新規BUYとして扱う。"
  period_end: "forward期間末の未決済ポジションは強制決済せず、終値でmark-to-marketし、open_position_at_endを記録する。"
  no_trade_conditions:
    - "欠損・重複・端点欠損を含むデータは評価を拒否する。"
    - "シグナル計算に必要なwarm-up履歴が不足する場合は評価を拒否する。"
    - "合成日足上のシグナルと約定は実測データと分けて集計する。"
  simplicity_rationale: "単一の事前登録期間を一度だけ評価し、期間、銘柄、パラメータ、費用ケース、評価基準を結果確認後に変更しない。"

data:
  source: "Binance Public Data monthly/daily archives"
  snapshot_id: "DATA-2026-0004"
  research_venue: "Binance Global Spot"
  target_venue: "Binance Japan Spot"
  symbol: "BTCUSDT"
  timeframe: "1d UTC"
  known_limitations:
    - "線形補間された1時間足を含む日足は取引所の実測値ではない。"
    - "Global履歴はBinance Japanの板、spread、約定、手数料の正本ではない。"
    - "2026年のforward期間は単一銘柄・単一venue proxy・短期間であり、統計的な十分性を保証しない。"

evaluation:
  primary_metric: "base feeでoverlayの最大DDがDonchian単独以上（悪化しない）か。"
  secondary_metrics:
    - "base・adverse・stress feeでの最終資産、CAGR、最大DD"
    - "overlayとbaseの最大DD改善幅、CAGR差"
    - "往復取引数、勝率、期待値、総手数料"
    - "未決済ポジション、合成日足上のシグナル・約定数"
    - "Buy and Holdとの比較"
  candidate_criteria:
    - "データ品質、会計、未来参照の検査をすべて通過する。"
    - "base feeでoverlayの最大DDがbase以上である。"
    - "base feeでoverlayのCAGRがbaseを下回らない。"
    - "base feeでclosed round tripsが3件以上ある。"
  rejection_criteria:
    - "未来情報、同一終値約定、または会計不整合が見つかる。"
    - "base feeでoverlayの最大DDがbaseより2 percentage points超悪化する。"
    - "base feeでoverlayのCAGRがbaseより5 percentage points超悪化する。"
  inconclusive_conditions:
    - "candidate・rejectionのいずれも満たさない。"
    - "closed round tripsが3件未満で、相対比較の証拠が不足する。"
  maximum_variants: 1
  random_seed: 0

cost_model:
  fee_model_version: "FEE-2026-0001-initial-assumption"
  fee_sensitivity_cases:
    - "片道0.001 (base)"
    - "片道0.0015 (adverse)"
    - "片道0.002 (stress)"
  spread_assumption: "往復0.0005で固定する。"
  slippage_assumption: "片道0.0005で固定する。"

provenance:
  parent_experiment_ids:
    - "EXP-2026-0006"
  preregistration_commit: "このファイルを追加するコミットでforward期間、固定条件、判定基準を結果確認前に登録する。"
