schema_version: 1
experiment_id: "EXP-2026-0017"
created_at_utc: "2026-08-15T00:00:00Z"
owner_role: "research"
status: "registered"

hypothesis:
  statement: "EXP-2026-0015の通常損切り反落幅を1 ATRから1.5 ATRへ広げると、早すぎる退出を減らし、損切りを完全に無効化するEXP-2026-0016より低いリスクで利益を改善できる可能性がある。"
  economic_rationale: "EXP-2026-0016では通常損切り無効化により5/6銘柄の利益が増えた一方、5/6銘柄で最大DDが悪化した。1.5 ATRはその中間の退出距離を検証する。"
  parent_experiment_ids:
    - "EXP-2026-0015"
    - "EXP-2026-0016"
  symbols:
    - "LINKUSDT"
    - "UNIUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
    - "NEARUSDT"
    - "AAVEUSDT"

methodology:
  input: "EXP-2026-0015と同一のZOOMEX trade・mark・Funding・銘柄仕様。"
  evaluation_window: "2022-02-01T00:00:00Z〜2025-12-31T23:59:59Z UTC。"
  control: "通常損切り反落幅1.0 ATRのEXP-2026-0015固定実装。"
  variant: "通常損切り反落幅だけを1.5 ATRへ変更し、1.618監視開始、2.618緊急停止、清算代理式、14日時間切れ、利確、エントリー、固定ロット、費用を変更しない。"
  maximum_variants: 1
  no_parameter_sweep: true
  no_trade_conditions:
    - "controlとvariantで入力データ、銘柄、期間、費用モデルが一致しない場合は比較を拒否する。"
    - "欠損、重複、内部gap、補間行がある場合は拒否する。"
  execution_gate: "研究比較のみ。paper・shadow・liveは許可しない。"

evaluation:
  status: "COMPLETED_DIAGNOSTIC"
  primary_metric: "variantとcontrolの銘柄別・中央値・合算の費用控除後最終資産差。"
  secondary_metrics:
    - "最大DD差、通常損切り・緊急停止・時間切れ・利確の件数と損益差"
    - "NISAインデックス4年複利+46.41%基準への到達可否"
  diagnostic_rule: "variantがcontrolを上回る銘柄数と、最大DDが悪化する銘柄数を同時に報告する。"
  benchmark_rule: "インデックス基準未達でも、1.5 ATRへの変更による差分診断自体は報告する。"
  promotion_rule: "この比較結果だけではpaper・shadow・liveへ昇格しない。"
  result_artifact: "artifacts/EXP-2026-0017/summary.json"
  result_summary: "1.5 ATR variantは6銘柄中5銘柄で最終資産が改善し、4銘柄で最大DDが改善した。最終資産差の中央値は+10.71 USDTだが、AAVEの-81.75 USDTにより合算差は-30.58 USDTで、インデックス基準も未達。"

