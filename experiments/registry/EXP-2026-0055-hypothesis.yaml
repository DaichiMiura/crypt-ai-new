schema_version: 1
experiment_id: "EXP-2026-0055"
created_at_utc: "2026-08-17T15:50:08Z"
owner_role: "research"
status: "completed"

hypothesis:
  statement: "9 source銘柄で費用の2倍を超える6時間上昇eventを確率分類し、時間分離した確率校正、30日周期再学習、leave-one-asset-out転移gateを通過したmodelは、学習labelを一度も使わないBCH・LTC・DOT・DOGEの2026-01-01〜2026-07-31に、cashと固定6時間momentumを費用・Funding込みnet PnLで上回る可能性がある。"
  economic_rationale: "平均0付近へ縮むreturn回帰ではなく、往復費用0.32%を十分に超えるtail eventを直接学ぶ。dimensionlessな価格・volatility・activity・BTC regime・横断特徴だけに限定し、銘柄固有IDを捨てることで未知銘柄にも共通する短期状態持続を検証する。"
  expected_failure_modes:
    - "source銘柄にも安定した分類signalがなく、Brier scoreやPnLがconstant・momentumを上回らない。"
    - "上昇eventの確率とreturn magnitudeが一致せず、分類精度があっても費用控除後期待値が負になる。"
    - "source内の銘柄転移に成功しても、未観測4銘柄のmicrostructureやregimeへ移転しない。"
    - "30日周期・730日windowがconcept driftへ遅れる、または学習標本減少で不安定になる。"
    - "1時間Klineが板、queue、時変spreadを表さず、固定費用が実約定を過小評価する。"
    - "固定probability/margin gateで取引数が不足する。"

methodology:
  setup: "UTC 00:00、06:00、12:00、18:00だけで判断する。timestampがt-1hの確定足までをfeatureに使い、trade Klineのt openでentry、t+6h openでexitする。symbol ID、生price、target assetのlabelを使わない。"
  target: "UP=1 if (exit_open/entry_open - 1) > 0.0064、otherwise 0。0.0064はbase往復費用0.0032の2倍。境界をまたぐ未成熟labelはpurgeする。"
  features:
    - "local trade close log return 1、3、6、12、24時間。"
    - "1時間log returnの母標準偏差6・24時間と24時間downside semivolatility。"
    - "直前1時間足のbody=(close-open)/open、range=(high-low)/open。"
    - "log1p(volume)とlog1p(turnover)の直近24実測足z-score。"
    - "BTCUSDT contextの6・24時間log returnと24時間volatility。"
    - "同時刻group内の6時間return降順percentile rank、中央値差、母標準偏差。"
    - "UTC hourのsin/cosとBTC 24時間return符号×BTC 24時間volatility。"
  feature_count: 21
  probability_calibration: "各modelのfit期間より後、評価期間より前のsource-only期間でPlatt scalingを1回fitする。校正器は切片付きL2 logistic、正則化lambda=1.0、確率clip=1e-6。評価対象銘柄のlabelは使わない。"
  models:
    logistic: "featureをfit期間だけで平均0・母標準偏差1へ標準化し、切片を正則化しないL2 logistic regression。lambda=1.0、Newton法最大100回、gradient infinity norm<1e-8で収束。class weightなし。"
    xgboost: "xgboost 3.4.1 native API。objective=binary:logistic、eval_metric=logloss、max_depth=3、eta=0.05、min_child_weight=20、subsample=1、colsample_bytree=1、lambda=10、alpha=0、gamma=0、tree_method=hist、max_bin=256、seed=0、nthread=1、num_boost_round=200。early stopping・探索なし。"
  source_temporal_split: "fit=2022-02-01〜2023-12-31完了label、calibration=2024-01-01〜2024-12-31完了label、development=2025-01-01〜2025-12-31完了label。同時刻groupを分割せず各境界で6時間purgeする。"
  leave_one_asset_out: "9 source銘柄を1つずつ外し、残り8銘柄だけのfit/calibration labelで学習・校正し、外した銘柄の2025年を予測する。外した銘柄の全期間labelをfit、scaling、calibration、thresholdへ使わない。各foldの候補は外した1銘柄だけなのでtop-minus-second marginは定義せず、P(UP)>=0.45と期待gross return>0.0064だけをentry gateにする。0.03 marginは4銘柄を同時比較するfinal target専用とする。"
  model_selection: "各modelを同一9-fold gateで独立評価し、全gateを満たすmodelだけを候補にする。候補中、USDT centへROUND_HALF_EVENしたaggregate base net PnL最大を選び、同額ならlogisticを選ぶ。候補0ならtargetを開かずREJECTED。"
  adaptive_retraining: "target評価では30日ごとにsource-only直近730日を再学習する。各cutoffで時間順の先頭80%をfit、6時間purge後の末尾20%をcalibrationとし、次の30日境界で期限切れとする。target labelは過去分も使わない。"
  entry_rule: "各判断時刻で対象groupの校正済みP(UP)最大銘柄を選ぶ。top probability>=0.45、top-minus-second>=0.03、かつsource calibrationから固定手順で求める p*mean(UP gross return)+(1-p)*mean(non-UP gross return)>0.0064 の場合だけ100 USDT longする。同値はsymbol昇順。"
  exit_rule: "entryから6時間後のtrade Kline openで全量exit。途中resize、利確、損切り、signal反転決済なし。"
  no_trade_conditions:
    - "probability、margin、期待gross returnのいずれかがgate未達または非有限。"
    - "必要な24時間windowに欠測、重複、補間、非正価格、非有限値がある。"
    - "modelが30日期限を超過、学習・校正が未収束、片方のclassしかない。"
    - "Funding cadence、minimum quantity、quantity step、risk上限、reserve cashを検査できない。"
  simplicity_rationale: "固定21特徴量、2 model族各1設定、1 probability gate、1 margin、long top1、固定100 USDTに限定し、feature・threshold・hyperparameter探索、short、ニューラルネット、RL、AutoMLを行わない。"

