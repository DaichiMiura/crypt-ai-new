  diagnostic_rule: "variantがcontrolを上回るかを事前登録6銘柄で確認し、結果を見て銘柄を選別しない。"
  benchmark_rule: "インデックス基準未達でも、損切り無効化による差分診断自体は報告する。"
  promotion_rule: "この比較結果だけではpaper・shadow・liveへ昇格しない。"
  result_artifact: "artifacts/EXP-2026-0016/summary.json"
  result_summary: "通常損切り無効variantは6銘柄中5銘柄で最終資産が改善し、最終資産差の中央値は+68.28 USDTだった。一方、5銘柄で最大DDが悪化し、緊急停止も増え、インデックス基準は未達。"

