    - "AAVEUSDT"

methodology:
  input: "EXP-2026-0015と同一のZOOMEX trade・mark・Funding・銘柄仕様。"
  evaluation_window: "2022-02-01T00:00:00Z〜2025-12-31T23:59:59Z UTC。"
  control: "EXP-2026-0015の通常1 ATR損切りを有効化した固定実装。"
  variant: "通常1 ATR損切りだけを無効化し、2.618緊急停止、清算代理式、14日時間切れ、利確、エントリー、固定ロット、費用を変更しない。"
  maximum_variants: 1
  no_parameter_sweep: true
  no_trade_conditions:
