schema_version: 1
experiment_id: "EXP-2026-0052"
created_at_utc: "2026-08-17T18:30:00Z"
owner_role: "research"
status: "completed"

hypothesis:
  statement: "EXP-2026-0042の週次top2候補に対し、判断時点より前に損益が確定した週だけで学習するロジスティック回帰をtrade-quality filterとして適用すると、固定ルール単独より費用控除後損益または最大drawdownを改善できる可能性がある。"
  economic_rationale: "同じ相対momentumシグナルでも、市場中央値momentum、候補のmomentum強度、順位、直近volatilityにより次週の費用控除後期待値が異なる可能性がある。単純な線形確率モデルで低品質候補だけを見送れば、元戦略の決定論的な順位規則を保ちながら不要な曝露を減らせる。"
  expected_failure_modes:
    - "暗号資産のregime変化により過去の係数が次期へ移転しない。"
    - "4銘柄・週次標本では学習量が不足し、予測確率が不安定になる。"
    - "0.50閾値が取引を過度に減らし、上昇局面の利益を逃す。"
    - "特徴量が元のmomentum規則と重複し、追加情報を持たない。"

methodology:
  setup: "EXP-2026-0042と同じZOOMEX 4銘柄、確定2時間足、30日相対momentum、週次更新、top2、最下位転落退出をbaselineとする。各週次判断で全4銘柄の候補標本を作り、当該判断以前に84本先のopenが確定した標本だけを使ってモデルを再学習する。"
  features:
    - "時刻tの確定closeまでの30日momentum_return"
    - "時刻tの4銘柄market_median_momentum"
    - "時刻tのcross_sectional_rankを1〜4へ固定した数値"
    - "時刻tまでの84本close-to-close returnの母標準偏差"
  target: "時刻tの次足openから84本後のopenまでのlong returnが、固定round-trip cost 0.0032を上回ると1、それ以外を0とする。"
  model: "L2正則化付きロジスティック回帰。各再学習時にtrain標本だけで特徴量を標準化し、batch gradient descent 800回、learning rate 0.05、L2 0.01、seed 0（乱数不使用）で固定する。"
  entry_rule: "EXP-2026-0042が週次top2として選んだ候補のうち、学習済みモデルの予測確率が0.50以上の銘柄だけを次足openでlongする。学習標本が80未満またはtrain labelが単一classなら全候補を見送る。"
  stop_rule: "採用した建玉にはEXP-2026-0042と同じ最下位転落退出を適用し、triggerの次足openで退出する。"
  exit_rule: "週次更新でtop2から外れる、market regimeが非正、ML確率が0.50未満、または最下位転落退出で次足openに決済する。評価終了時は最終closeでmark-to-marketする。"
  no_trade_conditions:
    - "学習済み標本が80未満、labelが単一class、または特徴量が非有限。"
    - "元のEXP-2026-0042が候補を出さない。"
    - "データの欠損、重複、補間、時刻不整合、非正価格を検出する。"
    - "配分上限、reserve cash、銘柄上限を満たさない。"
  simplicity_rationale: "説明可能な単一線形モデル、4特徴量、閾値0.50、1 variantだけを固定し、ニューラルネット、木モデル、特徴選択、閾値探索を行わない。"

