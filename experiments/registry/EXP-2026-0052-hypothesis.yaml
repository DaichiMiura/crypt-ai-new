  result_summary: "2025 retrospective evaluationでbaseline +235.34 USDTに対しML filter -32.69 USDT、費用2倍 -33.88 USDT。baseline候補42件中採用3件（7.14%）に絞り、その3候補の84本target labelはすべて負だった。最大DDは-10.11%から-5.87%へ縮小したが、取引2往復、baseline非改善、stress損失の棄却条件に該当してREJECTED。"

