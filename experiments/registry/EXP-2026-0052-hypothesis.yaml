    - "固定4銘柄かつ週次の少数標本で、他銘柄や他期間への一般化を示さない。"
    - "公開Kline/Fundingは板、部分約定、証拠金、清算、注文拒否を表さない。"
    - "targetはopen-to-open価格returnの費用近似であり、portfolioのFundingや途中退出を直接学習しない。"
    - "ZOOMEX公開履歴上の研究結果であり、実約定の有効性は未検証。"

