hypothesis:
  statement: "判断時点までの30日betaでBTC市場共通成分を除いた6時間net return残差をranking・robust回帰し、BTC市場return予測と再合成して時間分離calibration下限で取引すると、source9銘柄の12 asset×time OOS foldで正のrank ICと十分な取引数を持ち、封印したETC・FIL・TRX・XLMへ移転する可能性がある。"
  economic_rationale: "短期暗号資産returnの大部分はBTC共通因子で、raw銘柄順位labelはregime変化により不安定になり得る。point-in-time betaで共通因子を除けば、相対強弱modelは通貨固有の継続性へ集中できる。市場returnと残差returnを別々のrobust modelで推定すれば、順位選択と絶対費用gateを分離できる。"
  expected_failure_modes:
    - "過去30日betaが6時間先のBTC感応度を表さず、残差labelへnoiseを増やす。"
    - "BTC market modelと残差modelの誤差が加算され、再合成net returnが不安定になる。"
    - "calibration q30下限が0以下へ縮み、取引数が240未満になる。"
    - "regime 4状態の標本が不足し、treeが不安定なinteractionへ適合する。"
    - "source内で成立しても未観測4銘柄のbeta・残差構造へ移転しない。"
    - "15分Klineは板、queue、時変spreadを表さず、固定費用が実約定を過小評価する。"

methodology:
  setup: "EXP-2026-0056と同じZOOMEX 15分足、UTC 6時間判断、t open entry、t+6h open exit、100 USDT long、費用・Funding会計を使う。tより前に終了した足だけをfeatureとbetaへ使う。"
  absolute_label: "100 USDT longのfee・spread・slippage・Funding・quantity丸め込みnet_return。"
  beta: "判断直前30日の非重複6時間log return 120個からcov(asset,BTC)/var(BTC)を計算する。BTC母分散<=1e-12なら除外する。"
  residual_label: "absolute_net_return - beta_30d * BTCのt openからt+6h openまでのgross simple return。"
  rank_target: "各train query内でresidual_labelを昇順rankし0..N-1 relevanceへ変換する。同値はsymbol昇順。"
  features: "EXP-2026-0056の26特徴量にbeta_30d、BTC 24h return>0、BTC 24h volatility>BTC 30d volatilityの3個を追加する。"
  feature_count: 29
  models:
    ranker: "xgboost 3.4.1、objective=rank:pairwise、eval_metric=ndcg@1、max_depth=3、eta=0.05、min_child_weight=20、subsample=1、colsample_bytree=1、lambda=10、alpha=0、gamma=0、tree_method=hist、max_bin=256、seed=0、nthread=1、300 round。"
    residual: "同tree設定、objective=reg:pseudohubererror、eval_metric=mphe、huber_slope=0.02、300 round。実験前synthetic preflightで0.01がmin_child_weight=20との組合せにより定数予測となったため、分岐を確認できた最小固定値0.02を使い、residual_labelを推定する。"
    market: "同tree設定、objective=reg:pseudohubererror、eval_metric=mphe、huber_slope=0.02、300 round。各decision_timeを1行に一意化し、BTC context・regime・UTC時刻の9特徴量からBTC 6時間gross simple returnを推定する。"
  temporal_calibration: "各outer cutoff直前最大730日を時間順で先頭80% fit、6時間purge後の末尾20% calibrationとする。初回foldだけはDATA-2026-0008開始後の30日beta warmupにより利用可能な実測標本が約699日となり、不足分を補間しない。calibration error=actual absolute net return-reconstructed predictionの30%分位点を固定し、評価lower_estimate=reconstructed prediction+error_q30とする。"
  entry_rule: "held-out groupでrank score最大を選ぶ。normalized_margin=(top-second)/max(group score母標準偏差,1e-12)>=0.25かつlower_estimate>0の場合だけ100 USDT longする。同値はsymbol昇順。"
  exit_rule: "6時間後の15分Kline openで全量exit。途中resize、利確、損切り、signal反転決済なし。"
  no_trade_conditions:
    - "normalized margin<0.25、lower estimate<=0、または入力・予測が非有限。"
    - "30日betaまたは97 close feature windowに欠測、重複、補間がある。"
    - "model期限、Funding、quantity、minimum quantity、reserve cashを検査できない。"
  simplicity_rationale: "29特徴量、ranker1、residual Huber1、market Huber1、calibration q30 1個、margin1個の単一pipeline。探索、short、neural network、RL、target別調整なし。"

