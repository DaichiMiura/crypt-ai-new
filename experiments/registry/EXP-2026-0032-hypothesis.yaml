schema_version: 1
experiment_id: "EXP-2026-0032"
created_at_utc: "2026-08-16T04:00:00Z"
owner_role: "research"
status: "registered"

hypothesis:
  statement: "現物をロングし、同額のZOOMEX USDT無期限先物をショートするベーシス収束ペアは、方向性ショートよりも市場方向への依存を抑え、Fundingと価格差の収束を収益源にできる可能性がある。"
  economic_rationale: "現物と先物の同時保有で価格方向のエクスポージャーを相殺し、先物プレミアムが縮小する際の収束益と、正のFundingをショート側で受け取る。"
  parent_experiment_ids:
    - "EXP-2026-0031"
    - "EXP-2026-0030"
  symbols:
    - "LINKUSDT"
    - "UNIUSDT"
    - "AVAXUSDT"
    - "AAVEUSDT"

methodology:
  input: "ZOOMEX spot trade Kline、linear perpetual trade/mark Kline、Funding履歴。"
  evaluation_window: "2022-02-01T00:00:00Z〜2025-12-31T23:59:59Z UTC。"
  warmup_window: "評価開始前400本をデータ品質・シグナル計算のウォームアップに使う。"
  basis_definition: "perp_mark_close / spot_close - 1。"
  signal_strategy: "basisが+0.50%以上でentry、+0.10%以下への収束でexit。最大保有は360本（30日）。シグナルは確定足の次の2時間足始値へ遅延する。"
  pair_construction: "1ペアあたり現物100 USDTを買い、同額のlinear perpetualをショートする。最大4ペア、予備資金200 USDT。"
  funding_accounting: "正のFundingは既存先物shortが受け取り、負のFundingは支払う。Funding時刻の既存建玉だけに適用する。"
  arms:
    pair_1: "最大1ペア（総両脚元本200 USDT）。"
    pair_2: "最大2ペア（総両脚元本400 USDT）。"
    pair_4: "最大4ペア（総両脚元本800 USDT）。"
  capital_allocation:
    initial_equity: "1000"
    reserve_cash: "200"
    pair_notional_per_leg: "100"
    max_concurrent_pairs: 4
    compounding: false
  costs:
    spot_fee_rate: "0.001"
    perp_fee_rate: "0.0006"
    spot_round_trip_spread: "0.001"
    perp_round_trip_spread: "0.001"
    spot_slippage_per_fill: "0.0005"
    perp_slippage_per_fill: "0.0005"
  no_parameter_sweep: true
  no_trade_conditions:
    - "現物・先物・mark・Fundingの共通期間、時刻、銘柄対応が検証できない場合は拒否する。"
    - "補間行、欠損、重複、内部gap、正でない価格、非有限Fundingがある場合は拒否する。"
    - "現物データが取得できないADAUSDT・NEARUSDTは本実験のユニバースに含めない。"
  execution_gate: "研究比較のみ。paper・shadow・liveは許可しない。"

evaluation:
  status: "COMPLETED"
  primary_metric: "ペアarmごとの最終equity、最大DD、Funding込み純損益。"
  secondary_metrics:
    - "実現ペア損益、Funding受払、手数料、平均保有期間、評価終了時openペア"
    - "4年間の年率10%複利インデックス基準1464.10 USDTとの差"
    - "basis分布、entry/exit件数、配分拒否数、最大両脚元本"
  diagnostic_rule: "単一armを自動採用しない。ペア会計が価格方向を十分に相殺しているか、費用・Funding差引後に残るかを確認する。"
  promotion_rule: "単一期間のベーシス結果だけではpaper・shadow・liveへ昇格しない。"
  result_artifact: "artifacts/EXP-2026-0032/summary.json"
  result_summary: "現物データが取得できる4銘柄で、pair_1は最終equity999.41 USDT・最大DD-0.189%、pair_2とpair_4は999.19 USDT・最大DD-0.224%となった。Fundingは-0.44 USDT前後、手数料は7.69〜8.64 USDTで、ベーシス収束益は費用を補えず、今回の固定条件は不採用とする。"

data:
  source: "ZOOMEX Global public V3 REST API"
  research_venue: "ZOOMEX spot and linear USDT perpetual"
  target_venue: "ZOOMEX spot and linear USDT perpetual"
  timeframe: "120 minutes UTC"
  artifacts:
    spot: "data/processed/EXP-2026-0032/{SYMBOL}/spot-2h.csv"
    perpetual_trade: "data/processed/EXP-2026-0015/{SYMBOL}/trade-2h.csv"
    perpetual_mark: "data/processed/EXP-2026-0015/{SYMBOL}/mark-price-2h.csv"
    funding: "data/processed/EXP-2026-0015/{SYMBOL}/funding-rate.csv"
    spot_metadata: "var/exp-2026-0032-spot-data.json"
    perpetual_metadata: "var/exp-2026-0015-data.json"

execution_status:
  preregistered: true
  spot_data_acquired: true
  runner_exists: true
  backtest_started: true
  backtest_completed: true
  backtest_result_artifact: "artifacts/EXP-2026-0032/summary.json"
  paper_started: false
  shadow_started: false
  live_started: false

references:
  - title: "Fundamentals of Perpetual Futures"
    url: "https://arxiv.org/abs/2212.06888"
    relevance: "無期限先物の現物からの乖離と裁定可能性を扱う研究。"
  - title: "An Empirical Investigation on Risk Factors in Cryptocurrency Futures"
    url: "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=4657014"
    relevance: "暗号資産先物でベーシスが重要なリスク要因となる可能性を検証した研究。"

provenance:
  parent_experiment_ids:
    - "EXP-2026-0031"
    - "EXP-2026-0030"
  preregistration_commit: "この仮説ファイルをバックテスト結果確認前に追加し、4銘柄、entry0.50%、exit0.10%、最大30日、1ペア100 USDTを固定する。"
