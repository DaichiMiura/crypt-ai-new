hypothesis:
  statement: "判断前のpremium index水準・変化・分散・横断順位と確定済みFundingを価格controlへ加えたML rankingは、価格control-only modelより6時間先の費用込みnet return順位を改善し、source9銘柄で正のOOS rank ICと費用耐性を示す可能性がある。"
  economic_rationale: "perpetualとindexの乖離圧力およびFunding履歴は、価格returnだけでは見えないlong/short混雑を表す可能性がある。混雑の継続と巻き戻しを横断比較すれば相対選択へ増分情報を与え得る。"
  expected_failure_modes:
    - "premiumが価格returnの遅行変換にすぎず、価格controlへ増分情報を与えない。"
    - "混雑は継続と反転の両方を起こし、treeがregimeを安定して分離できない。"
    - "Fundingは低頻度で同値が多く、6時間horizonの順位に弱い。"
    - "30日premium z-score warmupや欠測により標本が減る。"
    - "微弱なgross edgeがfee、spread、slippage、Fundingで消える。"
    - "source foldの逐次再利用による多重試行で見かけの改善が生じる。"

methodology:
  setup: "ZOOMEX linear USDT perpetualの15分trade Kline、15分premium index Kline、FundingをUTC 6時間判断へ整列する。entryはt open、exitはt+6h open。t-15分までの確定Klineとevent_time<tのFundingだけを使う。"
  label: "100 USDT longのfee・spread・slippage・Funding・quantity丸め込みabsolute net_return。"
  features: "価格control14、premium13、Funding4の固定31特徴量。30日premium標準偏差<=1e-12ではz-score=0。横断premiumは同値平均rank、全銘柄dispersion<=1e-12ではrank=0.5・median差=dispersion=0。定義はdocs/premium-crowding-ml-research.md。"
  rank_target: "各train query内でabsolute net_returnを昇順rankし0..N-1 relevanceへ変換する。同値はsymbol昇順。"
  models:
    ranker: "xgboost 3.4.1、rank:pairwise、ndcg@1、max_depth=3、eta=0.05、min_child_weight=20、subsample=1、colsample_bytree=1、lambda=10、alpha=0、gamma=0、hist、max_bin=256、seed=0、nthread=1、300 round。"
    expected_return: "同tree設定、reg:pseudohubererror、mphe、huber_slope=0.02、300 round。absolute net_returnを推定する。"
    ablation: "同じranker・回帰・calibration・entry ruleでpremium・Funding17特徴量だけを除いた価格control14特徴量model。候補選択には使わない。"
  temporal_calibration: "各outer cutoff前最大730日を先頭80% fit、6時間purge後の末尾20% calibrationとする。30日warmupで初回foldは約699日。error=actual net_return-predictionのq30を固定し、lower_estimate=prediction+error_q30。"
  entry_rule: "held-out groupでrank score最大を選び、normalized margin>=0.25かつlower_estimate>0の場合だけ100 USDT long。"
  exit_rule: "6時間後の15分trade Kline openで全量exit。途中売買なし。"
  no_trade_conditions:
    - "margin<0.25、lower estimate<=0、入力・予測非有限。"
    - "tradeまたはpremiumの必要window、直前9 Funding、会計系列が欠ける。"
    - "model期限、quantity、minimum、reserveを検査できない。"
  simplicity_rationale: "候補は固定31特徴量のranker1・Huber1・q30・margin0.25だけ。価格control-onlyは増分検証用の固定ablationで選択肢ではない。"

