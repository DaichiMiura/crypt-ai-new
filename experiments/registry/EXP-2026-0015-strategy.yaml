basic_policy:
  timeframe_minutes: 120
  direction: "short_only"
  entry_order_types:
    - "limit"
  market_entry_allowed: false
  signal_input: "closed_bars_only"
  unknown_or_incomplete_state: "NO_TRADE"
  same_bar_normal_exit_allowed: false
  max_holding_bars: 168
  max_holding_days: 14
  time_exit_rule: "約定後に完了した2時間足が168本へ達した時点で、損益にかかわらず時間切れ決済を要求する。"
  live_trading_enabled: false

symbol_policy:
  allowed_symbols:
    - "LINKUSDT"
    - "UNIUSDT"
    - "ADAUSDT"
    - "AVAXUSDT"
    - "NEARUSDT"
    - "AAVEUSDT"
  all_other_symbols: "NO_TRADE"
  symbol_normalization: "完全一致。大文字化や空白除去による暗黙の補正はしない。"
  dynamic_turnover_ranking: false
  runtime_addition_or_replacement: false

trend_policy:
  price_source: "trade close"
  fast_sma_bars: 200
  slow_sma_bars: 400
  downtrend_condition: "SMA200 < SMA400"
  equality: "NO_TRADE"
  insufficient_warmup: "NO_TRADE"
  signal_availability: "確定足で計算し、次の2時間足から利用する。"
  cross_count_filter: "初回実験では使用しない。別実験候補として保留する。"
  rejected_input:
    - "2時間足の内部欠損または重複"
    - "補間行"
    - "非正または非数値の終値"

entry_preparation_policy:
  atr_bars: 14
  rally:
    anchor: "下落トレンド開始後の最安値"
    confirmation: "確定終値がアンカーから2 ATR以上上昇"
  pullback:
    anchor: "上昇確認後の最高値"
    confirmation: "確定終値がアンカーから1 ATR以上下落"
  rebound:
    anchor: "下落確認後の最安値"
    confirmation: "確定終値がアンカーから0.5 ATR以上反発"
  required_order: "rally -> pullback -> rebound"
  regime_invalidation: "SMA200 >= SMA400または状態不明で全アンカーを破棄する。"
  availability: "準備完了イベントと3アンカーの価格・時刻は次の2時間足から利用する。"
  order_generation: "この段階では注文を生成しない。"

