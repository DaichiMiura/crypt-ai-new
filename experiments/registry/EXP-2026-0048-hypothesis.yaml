schema_version: 1
experiment_id: "EXP-2026-0048"
created_at_utc: "2026-08-17T12:58:10Z"
owner_role: "research"
status: "completed"

hypothesis:
  statement: "過去3回の確定Funding率が銘柄間で低い2銘柄をlong、高い2銘柄をshortするgross-neutralなキャリーは、ZOOMEXの6銘柄固定ユニバースで、価格損益・手数料・spread・slippage控除後も、現金保持ベースラインを上回る正の純損益を生む可能性がある。"
  economic_rationale: "Funding率は無期限先物の需給の偏りと保有コストを表す。銘柄間のFunding差が次のFunding期間にも持続するなら、方向性を相殺したlong/shortでFunding差を収益源にできる可能性がある。価格方向を予測するEXP-2026-0035/0042や、同一銘柄のspot-perpetual basisを使うEXP-2026-0032とは異なる収益源を検証する。"
  expected_failure_modes:
    - "Funding率の順位が次のFundingへ持続せず、価格損益がFunding受取を上回る。"
    - "銘柄間の市場β・清算リスクが相殺されず、gross-neutralでも大きなDDが発生する。"
    - "銘柄順位の入替えによる4脚の売買費用、spread、slippageがFunding差を食いつぶす。"
    - "2026年に固定した6銘柄ユニバースを過去へ適用するため、結果をZOOMEX全銘柄の普遍的効果と解釈できない。"

methodology:
  setup: "EXP-2026-0015のZOOMEX linear USDT perpetual trade 2時間足と8時間ごとのFunding履歴をUTCで整列する。各Funding時刻の現在値はシグナル計算へ使わず、直前3回の確定Funding率の単純平均だけを使う。"
  entry_rule: "Funding時刻tで直前3回の平均Funding率を銘柄間で昇順に順位付けし、低い2銘柄をlong、高い2銘柄をshortとして予約する。予約はtの次の確定2時間足openで実行する。Funding時刻tの支払いはt以前から保有する建玉だけへ先に適用する。"
  stop_rule: "固定stopは置かない。リバランスでdesired sideが0になった銘柄は次の2時間足openで決済する。"
  exit_rule: "3回のFundingイベントごとに順位を更新し、各銘柄のlong/short desired状態を次の2時間足openへ遅延させる。評価終了時の未決済建玉は最終closeでmark-to-marketし、未実現損益として明示する。"
  no_trade_conditions:
    - "6銘柄の2時間足時刻集合、Funding時刻集合、価格、Funding率が完全一致しない場合は実行を拒否する。"
    - "直前3回のFunding率が揃わない銘柄では順位を作らず、全銘柄をcash保持とする。"
    - "補間足、欠損、重複、非正価格、非有限Funding、未確定足では新規entryを行わない。"
    - "long_count + short_countがユニバース数を超える設定は拒否する。"
  simplicity_rationale: "lookback 3回、3イベントごとの更新、上下2銘柄、固定50 USDTロットを結果確認前に固定し、パラメータ探索を行わない。"

