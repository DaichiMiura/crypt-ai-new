data:
  source: "ZOOMEX Global public V3 REST API"
  snapshot_id: "DATA-2026-0005"
  timezone: "UTC"
  known_limitations:
    - "Funding履歴は公開APIの決済時刻と率であり、rateが事前に確定・観測できた受信時刻を含まない。"
    - "6銘柄は2026-08-15時点の選定で、上場廃止・流動性変化・point-in-time universeを再現しない。"
    - "公開KlineとFundingは板、部分約定、清算、証拠金、注文拒否を表さない。"
    - "結果はZOOMEX公開履歴上の研究結果であり、実約定の有効性を示さない。"

evaluation:
  baseline: "初期1000 USDTを全期間cash保持するcontrol。"
  primary_metric: "予約した2025-07-01以降のOOSで、手数料・spread・slippage・Funding・価格損益込みのnet PnLとcash controlとの差。"
  secondary_metrics:
    - "OOS最大DD、年率換算return/abs(max_drawdown)、Funding cash flow、価格損益、fee、売買回数、平均保有gross"
    - "2022-02-01〜2025-06-30のdevelopment期間とOOS期間の符号・銘柄別寄与"
    - "費用を2倍にした事前固定stress caseのOOS net PnL"
  expected_value_formula: "funding_cash_flow + realized_price_pnl + unrealized_price_pnl - entry_fees - exit_fees - modeled_spread_and_slippage"
  rejection_criteria:
    - "OOS net PnLが0以下、またはcash controlを下回る。"
    - "OOS Funding cash flowが、価格損益と全費用の合計を補えない。"
    - "OOS最大DDが-20%以下になる。"
    - "費用2倍stress caseでOOS net PnLが正にならない。"
    - "入力時点、Fundingの重複適用、会計再構築のいずれかを検証できない。"
  reserved_out_of_sample: "2025-07-01T00:00:00Z〜2025-12-31T23:59:59Z UTC。OOS結果を見た後に仕様・ユニバース・費用を変更しない。"
  maximum_variants: 1
  random_seed: 0
  research_status: "REJECTED"
  result_artifact: "artifacts/EXP-2026-0048/summary.json"
  result_summary: "基本費用では全期間final equity 432.96 USDT、net PnL -567.04 USDT、最大DD -57.74%。予約OOS（2025-07-01〜2025-12-31）はfinal equity 432.96 USDT、net PnL -77.09 USDT、Funding +0.27 USDT、fee 22.93 USDT、最大DD -17.31%でcash controlを下回った。費用2倍stressでは全期間final equity 242.60 USDT、OOSは開示可能な新規建玉がなくnet PnL 0で、採用条件を満たさない。Funding差は価格損益と売買費用を補えず、REJECTEDとする。"

