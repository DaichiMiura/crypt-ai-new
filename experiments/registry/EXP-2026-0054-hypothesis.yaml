evaluation:
  baselines:
    cash: "初期1000 USDTを保持し、PnL 0、取引0。"
    momentum: "同じ判断・entry・exit・100 USDT・top1・費用・Funding規則で、直近6時間log return最大かつ0より大きい銘柄をlongする。予測閾値は使わない。"
  primary_metric: "sealed holdoutの費用・Funding込みnet PnL。選択ML modelが0より大きく、かつmomentum baselineを上回ること。"
  secondary_metrics:
    - "base/stress net PnL、gross price PnL、Funding cash flow、fee、spread、slippage、completed round trips、turnover、trade rate。"
    - "最大drawdown、worst trade、平均win/loss、win rate、連敗、gross/equity比、銘柄別寄与。"
    - "gross-return MAE、rank IC、directional accuracy、XGBoost gain importance。これらは診断値で採否条件の代替にしない。"
    - "24・72・168時間block bootstrapによる、MLとmomentumの日次return差の95% percentile CI。各10,000回、seed 0。"
  expected_value_formula: "quantity * (adverse_exit_price - adverse_entry_price) + funding_cash_flow - entry_fee - exit_fee。spreadとslippageは各fill priceを不利側へ調整する。"
  rejection_criteria:
    - "2025 developmentで選択規則を満たすmodelがなくholdoutを開けない。"
    - "sealed holdoutのnet PnLが0以下、またはmomentum baseline以下。"
    - "sealed holdoutのcompleted round tripsが30未満。"
    - "fee・spread・slippageを2倍にしたstress net PnLが0以下。"
    - "sealed holdoutの最大drawdownが-10%以上に悪化する。"
    - "未来参照、split境界label、補間行、同時position、allocation rejection、会計不一致が1件以上ある。"
    - "再現runで選択model、予測、取引、PnLを一致させられない。"
  inconclusive_cap: "上記hard gateをすべて満たしても、3種類のblock長のいずれかでML-minus-momentum 95% CIが0を含む場合、research_statusは最大INCONCLUSIVEとする。3種類すべてのlower boundが0より大きい場合だけPASSED_FORWARD_TEST候補とする。"
  reserved_out_of_sample: "2026-01-01〜2026-07-31の封印holdout。2025 model選択gate後、選択した1 model・1設定で一度だけ開封する。"
