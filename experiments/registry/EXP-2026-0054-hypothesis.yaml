  known_limitations:
    - "公開Kline/Fundingは板、受信遅延、部分約定、注文拒否、時変spread、実際のFunding支払を表さない。"
    - "取得時instruments-infoを使うため、過去のtick size、quantity step、minimum quantity、Funding interval変更を完全には再現しない。"
    - "Funding notionalはsettlement時刻のmark Kline openを代理値とし、実際のsettlement markと一致する保証はない。"
    - "固定4銘柄で上場廃止・universe変更を含まず、他銘柄や他期間へ一般化しない。"
    - "欠測windowは補間せず除外するため、除外が特定regimeへ偏る可能性がある。"
