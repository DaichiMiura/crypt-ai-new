schema_version: 1
experiment_id: "EXP-2026-0054"
created_at_utc: "2026-08-17T14:49:31Z"
owner_role: "research"
status: "development_completed"

hypothesis:
  statement: "ZOOMEX linear perpetualの確定1時間足から作る価格・活動量・derivatives・BTC context・cross-sectional特徴量で6時間先gross log returnを予測し、予測値がbase往復費用の2倍を超えるtop1銘柄だけを100 USDT longすると、封印した2026-01-01〜2026-07-31期間にcashおよび固定6時間momentum baselineを費用・Funding込みnet PnLで上回る可能性がある。"
  economic_rationale: "短時間の価格継続性だけでなく、volatility、活動量、perpetual basis、premium、既知Funding、市場全体と横断順位には、6時間以内の状態持続を表す情報があり得る。一方で短期の小さな予測は費用で消えるため、gross予測がbase往復費用0.32%の2倍を超える場合だけ取引する。"
  expected_failure_modes:
    - "1時間Klineでは板・queue・時変spreadを観測できず、固定費用が短期約定を過小評価する。"
    - "2022〜2024で学習した関係が2025 developmentまたは2026 sealed holdoutのregimeへ移転しない。"
    - "銘柄横断の同時刻標本が独立ではなく、見かけの標本数より有効標本が少ない。"
    - "XGBoostが少数の外れ値や銘柄固有状態へ過適合し、Ridgeまたは単純momentumを上回らない。"
    - "0.64%閾値で取引数が30往復未満となり、損益差の不確実性が大きい。"
    - "Funding時刻、contract specificationの履歴、Kline openを使う約定近似が実約定と乖離する。"

methodology:
  setup: "DATA-2026-0006のZOOMEX 1時間足を使う。判断境界tをUTC 00:00、06:00、12:00、18:00に限定し、timestampがt-1hの足のcloseまでを特徴量へ使う。trade Klineのt openでentryし、t+6h openで全量exitする。同一銘柄のlabelと保有期間は重ねない。4取引対象を同時刻ごとにpoolして回帰し、各tで予測最大の1銘柄だけを候補にする。"
  features:
    - "各銘柄のtrade close log return: 1、3、6、12、24時間。いずれもt以前の確定足だけで計算する。"
    - "直前1時間足のrange=(high-low)/open、body=(close-open)/open、upper_wick=(high-max(open,close))/open、lower_wick=(min(open,close)-low)/open。"
    - "log1p(volume)とlog1p(turnover)の直近24実測足z-score。母標準偏差が1e-12以下なら当該判断時刻を除外する。"
    - "1時間log returnの直近6・24本の母標準偏差、およびsqrt(mean(min(return,0)^2))で定義する24時間downside semivolatility。"
    - "直前確定closeのlog(trade/mark) basis、log(mark/index) basis、premium index close。"
    - "timestampがtより厳密に前の最新Funding rate。直前2回の実測Funding時刻の差をcadenceとし、次回予定までの時間/cadenceを作る。cadenceが正でない場合は除外する。将来Funding値は使わない。"
    - "BTCUSDT context専用の6・24時間trade close log returnと24時間realized volatility。BTCUSDTは売買しない。"
    - "4対象銘柄の6時間log returnを降順rankし、(4-rank)/3でtop=1、bottom=0へ変換した値と、当該returnから4銘柄中央値を引いた値。"
  target: "trade Klineのt openからt+6h openまでのgross log return log(exit_open/entry_open)。モデル学習・選択だけに使い、予測閾値はlog(1.0064)とする。"
  models:
    ridge: "train内で各特徴量とtargetを平均0・母標準偏差1へ標準化し、切片を正則化せず、(X'X + alpha I)^-1 X'yをnumpy.linalg.solveで解く。alpha=10.0。標準偏差が1e-12以下の特徴量はz=0、係数=0とする。"
    xgboost: "xgboost 3.4.1のDMatrix/train native API。objective=reg:squarederror、eval_metric=rmse、max_depth=3、eta=0.05、min_child_weight=20、subsample=1.0、colsample_bytree=1.0、lambda=10.0、alpha=0.0、gamma=0.0、tree_method=hist、max_bin=256、seed=0、nthread=1、verbosity=0、num_boost_round=200。early stoppingと探索は行わない。"
  model_selection: "2022-02-01〜2024-12-31の完了labelだけで各モデルを1回学習し、2025 developmentの費用・Funding込みnet PnLが高い方を選ぶ。USDT centへROUND_HALF_EVENしたPnLが同額、または両モデルともnet PnLが0以下ならREJECTEDとしてholdoutを開かない。選択後は同じ設定で2025-12-31T18:00Zより前にexitが完了したtrain+development標本へ1回だけ再学習する。"
  entry_rule: "各判断境界で4銘柄の予測gross log returnが最大の銘柄を選び、その予測がlog(1.0064)より厳密に大きい場合だけtrade Klineのt openで100 USDT相当をlongする。同値はsymbol昇順で一意化する。"
  stop_rule: "intraperiod stopは置かない。欠測や会計不整合を検出した判断境界では新規entryを拒否し、既存positionは最後の有効markを用いて異常終了として報告する。"
  exit_rule: "entryから6時間後のtrade Kline openで全量exitする。途中resize、利確、損切り、signal反転決済は行わない。"
  no_trade_conditions:
    - "予測最大値がlog(1.0064)以下、または有限値でない。"
    - "4対象銘柄またはBTC contextの必要な24時間windowに欠測、重複、補間、非正価格、非有限値がある。"
    - "Funding cadenceまたは直近既知Fundingを時点整合的に構築できない。"
    - "100 USDT注文が取得時点のminimum quantityを満たさない、quantity stepで切り下げ後0、またはrisk上限・reserve cashを満たさない。"
  simplicity_rationale: "6時間horizon、固定24特徴量、2モデル族、各1設定、単一0.64%閾値、固定100 USDT、long top1だけに限定する。feature selection、hyperparameter探索、閾値探索、short、ニューラルネット、銘柄変更を行わない。"

