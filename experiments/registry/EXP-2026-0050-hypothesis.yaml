evaluation:
  baseline: "初期1000 USDT cash control。"
  primary_metric: "2025-07-01〜2025-12-31のretrospective holdoutにおける費用・Funding・価格損益込みnet PnL。"
  secondary_metrics:
    - "holdout completed round trips、最大DD、Funding、fee、平均保有時間、stop/time/mean-reversion別exit数"
    - "developmentとholdoutの損益符号、long/short向き別寄与"
    - "費用2倍stressのholdout net PnL"
  expected_value_formula: "long_leg_price_pnl + short_leg_price_pnl + funding_cash_flow - fees - spread - slippage"
  rejection_criteria:
    - "holdout completed pair round tripsが20未満。"
    - "holdout net PnLが0以下、またはcash controlを下回る。"
    - "holdout最大DDが-10%以下。"
    - "費用2倍stressのholdout net PnLが正でない。"
    - "両脚同期、未来参照、Funding、会計再構築を検証できない。"
  reserved_out_of_sample: "2025-07-01〜2025-12-31は既存研究で価格を観測済みなので、未観測OOSではなく固定仕様のretrospective holdoutとする。候補でも新しいforward evidenceなしに昇格しない。"
  maximum_variants: 1
  random_seed: 0
  research_status: "REJECTED"
  result_artifact: "artifacts/EXP-2026-0050/summary.json"
  result_summary: "holdoutでは31回以上のpair往復を確保したが、base net PnL -16.31 USDT、最大DD -2.44%、stress net PnL -26.40 USDT。exitはz-stop 21、mean reversion 10、time stop 1でstopが優勢。固定シグナルの費用ゼロ診断でもholdout -6.22 USDTのため、費用だけでなくspread平均回帰の不成立が主因。REJECTED。"

