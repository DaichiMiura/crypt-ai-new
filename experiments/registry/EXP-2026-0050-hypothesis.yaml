created_at_utc: "2026-08-17T16:20:00Z"
owner_role: "research"
status: "completed"

hypothesis:
  statement: "同じL1系暗号資産であるAVAXUSDTとNEARUSDTのlog価格差が過去の関係から2標準偏差以上乖離したとき、割高側をshort・割安側をlongする等金額ペアは、市場方向への依存を抑えながら費用控除後に平均回帰収益を生む可能性がある。"
  economic_rationale: "AVAXとNEARはともにスマートコントラクトL1として共通の暗号市場・セクター要因を受ける一方、短期的な需給やニュースで相対価格が乖離し得る。過去データだけで推定したlog価格関係へ戻る性質があれば、long/shortを同額にすることで市場方向より相対価格収束を主な収益源にできる。"
  expected_failure_modes:
    - "二銘柄の長期関係が構造変化し、spreadが平均回帰せず一方向へ拡大する。"
    - "rolling hedge ratioと平均・標準偏差の推定誤差が大きく、z-scoreが安定しない。"
    - "2脚のentry/exit費用とFundingが小さな収束利益を上回る。"
    - "等金額はdollar-neutralだがβ-neutralではなく、市場急変で価格riskが残る。"

methodology:
  setup: "ZOOMEX AVAXUSDTとNEARUSDT linear perpetualの同期した確定2時間足を使う。各時刻tより前720本（60日）のlog価格で、NEAR log価格を説明変数、AVAX log価格を目的変数とするOLS切片・傾きを推定する。現在spreadはtの確定closeで計算し、過去360本（30日）のspread平均・母標準偏差でz-score化する。"
  entry_rule: "flat時、確定足tのz-scoreが+2以上ならAVAX 50 USDT short・NEAR 50 USDT long、-2以下ならAVAX long・NEAR shortを予約し、tの次の2時間足openで同時に建てる。"
  stop_rule: "保有中のz-score絶対値が4以上になった確定足の次の2時間足openで両脚を決済する。片脚だけの継続は許さない。"
  exit_rule: "z-score絶対値が0.5以下へ戻るか、entryから168本（14日）経過した確定足の次の2時間足openで両脚を決済する。"
  no_trade_conditions:
    - "60日OLSまたは30日spread窓が不足する。"
    - "同期時刻、価格、Funding、補間フラグに欠損・重複・不正がある。"
    - "spread標準偏差が0または有限でない。"
    - "両脚を同じ次足openで建てられない、または配分・reserve cash条件を満たさない。"
  simplicity_rationale: "GitHub上の一般的なpairs-trading構造から、1 pair、OLS 60日、z-score 30日、entry 2、exit 0.5、stop 4、time stop 14日、等金額50 USDT/脚の1 variantだけを結果確認前に固定する。cointegration pair探索やparameter grid searchは行わない。"

