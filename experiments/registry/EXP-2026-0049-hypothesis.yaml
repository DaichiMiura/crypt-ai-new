evaluation:
  baseline: "cash control、および同じ固定シグナルを費用ゼロで会計する診断arm。"
  primary_metric: "2025-07-01以降OOSの費用・Funding・価格損益込みnet PnL。"
  secondary_metrics:
    - "OOS取引数、Funding cash flow、価格損益、全費用、最大DD、平均gross、gate別no-trade回数"
    - "全期間とOOSの予測Funding差、実現Funding差、β差"
    - "費用2倍stressのOOS net PnL"
  expected_value_formula: "funding_cash_flow + realized_price_pnl + unrealized_price_pnl - fees - spread - slippage"
  rejection_criteria:
    - "OOS completed round tripsが30未満で仮説を評価する証拠量が不足する。"
    - "OOS net PnLが0以下、またはcash controlを下回る。"
    - "OOS最大DDが-10%以下。"
    - "基本費用と費用2倍stressのいずれかでOOS net PnLが正でない。"
    - "未来参照、β計算、Funding適用、会計再構築を検証できない。"
  reserved_out_of_sample: "EXP-2026-0048で既に観測済みの2025-07-01〜2025-12-31を再利用するため、厳密な未観測OOSではなく診断後の追試と明記する。採用候補になっても新しいforward evidenceなしに昇格しない。"
  maximum_variants: 1
  random_seed: 0
  research_status: "REJECTED"
  result_artifact: "artifacts/EXP-2026-0049/summary.json"
  result_summary: "全期間715回、OOS 92回の更新すべてでentry gateが不成立となり取引0。OOSは70回が正負候補不足、22回が費用edge不足。候補が揃ったOOSのprojected carry最大は0.00097404で、登録閾値0.0048の20.3%に留まった。base/stressともnet PnL 0で、最低30往復と正のOOS損益を満たさずREJECTED。"

