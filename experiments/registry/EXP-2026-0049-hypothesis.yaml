created_at_utc: "2026-08-17T15:30:00Z"
owner_role: "research"
status: "completed"

hypothesis:
  statement: "絶対符号、費用超過edge、過去価格β差の3条件を満たす場合だけ建てる選択的Fundingキャリーは、EXP-2026-0048と同じZOOMEX 6銘柄で、取引を見送る自由を使って費用控除後OOS純損益を正にできる可能性がある。"
  economic_rationale: "EXP-2026-0048では相対順位だけを使ったため、longも正Fundingを支払い、予測差が費用を大幅に下回り、gross-neutralでも価格リスクが残った。Fundingの絶対符号、保有予定期間の期待carryが往復費用を上回る条件、価格β差の上限を事前に要求すれば、収益源が成立しない局面では現金を保持し、価格方向と回転費用への曝露を抑えられる可能性がある。"
  expected_failure_modes:
    - "厳しいedge条件により取引がゼロまたは少数となり、仮説を評価できない。"
    - "過去6回のFunding平均が将来6回へ持続せず、符号または差が反転する。"
    - "過去30日βが将来の価格共変動を表さず、β差上限内でも銘柄固有価格損失が発生する。"
    - "固定6銘柄では負Funding longと正Funding shortの候補が同時に揃わない。"

methodology:
  setup: "EXP-2026-0015のZOOMEX linear USDT perpetual 2時間足と8時間FundingをUTCで整列する。Funding時刻tではtのrateを使わず直前6回平均を予測値とする。各銘柄のβはtより前30日間の2時間close-to-close returnを、6銘柄等金額index returnへOLS（cov/var）して求める。"
  entry_rule: "6 Fundingイベント（48時間）ごとに、予測Funding平均が負の銘柄からlong 2、正の銘柄からshort 2を候補化する。全2+2組合せから、short平均Funding minus long平均Fundingを最大化し、かつlong平均βとshort平均βの絶対差が0.25以下の組合せを選ぶ。予測差×6が基本往復費用率0.0032の1.5倍（0.0048）以上の場合だけ、次の2時間足openで各50 USDTを建てる。"
  stop_rule: "固定価格stopは置かない。次の48時間更新時に絶対符号、edge、β条件のいずれかを満たさなければ次の2時間足openで全建玉を決済する。"
  exit_rule: "48時間ごとに条件を再評価し、選択集合が変われば次の2時間足openで不要建玉を決済し必要建玉を建てる。評価終了時は最終closeでmark-to-marketする。"
  no_trade_conditions:
    - "負Funding long候補2銘柄または正Funding short候補2銘柄が揃わない。"
    - "予測Funding差×6が0.0048未満。"
    - "β計算に30日分の連続した過去2時間returnがない、index分散が0、または有限βを計算できない。"
    - "全候補組合せでlong/short平均β差が0.25を超える。"
    - "時刻不一致、補間足、欠損、重複、非正価格、非有限Funding、未確定足を検出する。"
  simplicity_rationale: "診断で特定した3要因へ一つずつ固定gateを置く1 variantだけを実行する。lookback、保有予定Funding数、費用安全倍率、β窓、β差上限、ロット、OOSを結果確認前に固定し探索しない。"

