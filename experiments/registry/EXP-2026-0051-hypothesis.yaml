hypothesis:
  statement: "ZOOMEXの固定6銘柄で過去30日実現ボラティリティが最も低い2銘柄を週次保有し、市場全体の過去180日リターン中央値が正の期間だけlongする方式は、高ボラティリティ銘柄への集中と下降相場への曝露を避け、費用控除後にcash controlを上回る可能性がある。"
  economic_rationale: "暗号資産では高い値動きが高い将来収益を保証せず、投機需要が高ボラティリティ銘柄を割高にする可能性がある。低ボラティリティ銘柄へ限定し、長期市場regimeが正のときだけ保有すれば、上昇参加を残しながら大幅下落と不要な回転を抑えられる可能性がある。"
  expected_failure_modes:
    - "低ボラティリティが単に上昇力の弱さを表し、強いbull marketでcashや高β銘柄に劣後する。"
    - "180日filterが遅く、下落後まで保有し、回復初期を逃す。"
    - "6銘柄固定の順位が特定銘柄へ集中し、低vol効果ではなく銘柄固有效果になる。"
    - "週次入替えの費用とlong Funding支払いが収益を上回る。"

methodology:
  setup: "6銘柄の同期した確定2時間足を使う。時刻tのcloseまでの360本close-to-close returnの母標準偏差を年率化（sqrt(12*365)）し、30日実現volとする。各銘柄のt close / 2160本前close - 1を180日returnとし、その中央値を市場regimeとする。"
  entry_rule: "7日ごと（84本）に、180日return中央値が0より大きければ30日vol昇順の2銘柄を選び、次の2時間足openで各100 USDTをlongする。"
  stop_rule: "価格stopは置かない。週次更新時に市場regimeが非正なら全決済しcashを保持する。"
  exit_rule: "週次更新時にtop2から外れた銘柄を次の2時間足openで決済し、新しいtop2へ入れ替える。評価終了時は最終closeでmark-to-marketする。"
  no_trade_conditions:
    - "30日volまたは180日returnの履歴が不足する。"
    - "180日return中央値が0以下。"
    - "6銘柄の時刻、Funding時刻、価格が同期しない、または欠損・重複・補間・不正値がある。"
    - "配分上限、reserve cash、銘柄上限を満たさない。"
  simplicity_rationale: "30日vol、180日regime、週次、top2、各100 USDTを結果確認前に固定し、窓・銘柄数・閾値を探索しない1 variantとする。"

