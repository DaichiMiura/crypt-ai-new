# EXP-2026-0012専用のpaper資金配分。live adapterへ渡してはならない。
schema_version: 1
strategy_id: EXP-2026-0012
strategy_version: atr-20x3-sma200-donchian55
status: paper_approved
environment: paper
live_trading_enabled: false

allowed_symbols: [BTC_JPY]
allowed_order_types: [market]
allowed_products: [spot]
allow_short: false

allocation:
  initial_cash: 10000
  currency: JPY
  sizing: available_cash_capped_by_max_order_notional

cost_model:
  fee_rate: "0.001"
  round_trip_spread: "0.0005"
  slippage_per_fill: "0.0005"

limits:
  max_order_notional: 10000
  max_symbol_position_notional: 30000
  max_orders_per_minute: 1
  max_daily_loss: 3000
  max_drawdown: 4000

strategy:
  entry_window: 55
  baseline_exit_window: 20
  regime_window: 200
  atr_window: 20
  atr_multiplier: 3.0
  atr_average: simple_moving_average
  execution: next_day_open

paper_window:
  start_utc: "2026-08-16T00:00:00Z"
  end_condition: "人間が停止するまで。30日または1往復後に初回レビューする。"

stops:
  reject_interpolated_bar_orders: true
  halt_on_unknown_state: true
  halt_on_duplicate_bar_conflict: true
  halt_on_daily_loss: true
  halt_on_drawdown: true
