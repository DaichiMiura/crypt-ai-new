[project]
name = "crypt-ai"
version = "0.1.0"
description = "Research and validation workspace for an AI-assisted crypto trading company"
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.0,<4.0",
  "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
