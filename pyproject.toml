[project]
name = "crypt-ai"
version = "0.1.0"
description = "Research and validation workspace for an AI-assisted crypto trading company"
requires-python = ">=3.12"
dependencies = [
  "pandas>=3.0,<4.0",
  "pyyaml>=6.0,<7.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
]
research = [
    "numpy>=2.5,<3.0",
    "websockets>=16.1.1,<17",
    "xgboost>=3.4.1,<3.5",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
